<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexfund - Sign In</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .main-container {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow-y: auto;
        }

        .login-card {
            background: rgba(244, 245, 249, 0.96);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            margin: auto;
        }

        .header-section { margin-bottom: 25px; }
        .logo-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .logo-img { width: 35px; height: 35px; object-fit: contain; }
        .brand-name { font-size: 18px; font-weight: 600; color: #1a1a1a; font-style: italic; }
        .title { font-family: 'Merriweather', serif; color: #1d3bba; font-size: 32px; font-weight: 700; letter-spacing: 0.5px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-family: 'Merriweather', serif; font-size: 15px; color: #333; margin-bottom: 8px; }
        
        .input-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
            background: #ffffff; 
            border-radius: 25px;
            padding: 0 15px; 
            height: 52px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        
        .phone-wrapper { padding-left: 0; }
        .country-code { 
            color: #00a896; 
            font-weight: 600; 
            font-size: 15px; 
            padding: 0 15px; 
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .country-code i { font-size: 10px; color: #666; }
        
        .input-wrapper input { width: 100%; border: none; outline: none; background: transparent; font-size: 15px; color: #333; }
        .input-wrapper input::placeholder { color: #a0a0a0; }
        
        .toggle-password { position: absolute; right: 20px; color: #1d3bba; cursor: pointer; font-size: 16px; }

        .forget-password-container {
            text-align: right;
            margin-bottom: 20px;
            margin-top: -10px;
        }
        .forget-password {
            color: #1d3bba;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .login-btn { 
            width: 100%; 
            background: #1d3bba; 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 30px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .login-btn:hover { background: #142ca3; }
        .login-btn:disabled { background: #7a8ad1; cursor: not-allowed; }

        .footer-text { text-align: center; margin-top: 25px; font-size: 13px; color: #333; }
        .signup-link { color: #1d3bba; text-decoration: none; font-weight: 500; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-box {
            background: #ffffff; padding: 30px; border-radius: 20px;
            width: 90%; max-width: 320px; text-align: center;
            transform: scale(0.8); transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-icon { font-size: 50px; margin-bottom: 15px; }
        .modal-icon.success { color: #00a896; }
        .modal-icon.error { color: #e74c3c; }

        .modal-title { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 600; margin-bottom: 10px; color: #1a1a1a; }
        .modal-message { font-size: 14px; color: #666; margin-bottom: 20px; }

        .modal-btn {
            width: 100%; background: #1d3bba; color: white; border: none;
            padding: 12px; border-radius: 15px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: 0.3s;
        }
        .modal-btn:hover { background: #142ca3; }

        @media (max-width: 400px) {
            .login-card { padding: 20px; }
            .title { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="login-card">
            
            <div class="header-section">
                <div class="logo-container">
                    <img src="logo.png" alt="Nexfund Logo" class="logo-img">
                    <span class="brand-name">Nexfund</span>
                </div>
                <h1 class="title">Sign In</h1>
            </div>

            <form id="loginForm">
                
                <div class="input-group">
                    <label>Phone Number</label>
                    <div class="input-wrapper phone-wrapper">
                        <span class="country-code">+234 <i class="fa-solid fa-chevron-down"></i></span>
                        <input type="tel" id="phone" placeholder="Input phone number" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Input password" required>
                        <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePassword('password', this)"></i>
                    </div>
                </div>

                <div class="forget-password-container">
                    <a href="forgot-password.html" class="forget-password">Forget the password?</a>
                </div>

                <button type="submit" id="submitBtn" class="login-btn">Sign In</button>
                
                <div class="footer-text">
                    Don't have an account? <a href="index.html" class="signup-link">Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <i id="modalIcon" class="modal-icon"></i>
            <h2 class="modal-title" id="modalTitle">Title</h2>
            <p class="modal-message" id="modalMessage">Message goes here.</p>
            <button class="modal-btn" id="modalBtn">Okay</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBnGer9gGagzUmEkzwZnWhNGZ52WBL6vR0",
            authDomain: "nexfund-38027.firebaseapp.com",
            projectId: "nexfund-38027",
            storageBucket: "nexfund-38027.firebasestorage.app",
            messagingSenderId: "318202194753",
            appId: "1:318202194753:web:1bf7471c666acc50174fc0"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.remove("fa-eye-slash");
                iconElement.classList.add("fa-eye");
            } else {
                input.type = "password";
                iconElement.classList.remove("fa-eye");
                iconElement.classList.add("fa-eye-slash");
            }
        }

        let redirectAfterModal = false;
        const modal = document.getElementById('customModal');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalBtn = document.getElementById('modalBtn');

        function showModal(type, title, message, shouldRedirect = false) {
            if (type === 'success') {
                modalIcon.className = 'modal-icon success fa-solid fa-circle-check';
            } else {
                modalIcon.className = 'modal-icon error fa-solid fa-circle-exclamation';
            }
            
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            redirectAfterModal = shouldRedirect;
            modal.classList.add('active');
        }

        modalBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            if (redirectAfterModal) {
                window.location.href = "dashboard.html"; 
            }
        });

        // ✅ BUILD ALL POSSIBLE EMAIL FORMATS
        function buildPossibleEmails(phone) {
            let rawPhone = phone.replace(/\s+/g, '');
            
            // If user typed with leading 0 (e.g., 08012345678)
            let withPlus234 = rawPhone;
            if (rawPhone.startsWith('0')) {
                withPlus234 = `+234${rawPhone.substring(1)}`;
            } else if (!rawPhone.startsWith('+')) {
                withPlus234 = `+234${rawPhone}`;
            }
            
            const noPlus = withPlus234.replace(/^\+/, '');          // 2348012345678
            const withZero = withPlus234.replace(/^\+234/, '0');     // 08012345678
            const noPrefix = withPlus234.replace(/^\+234/, '');      // 8012345678
            
            // Return all unique email formats
            return [...new Set([
                `${noPlus}@nexfund.com`,     // 2348012345678@nexfund.com
                `${withPlus234}@nexfund.com`, // +2348012345678@nexfund.com
                `${withZero}@nexfund.com`,    // 08012345678@nexfund.com
                `${noPrefix}@nexfund.com`     // 8012345678@nexfund.com
            ])];
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!phone || !password) {
                return showModal('error', 'Missing Fields', 'Please enter your phone number and password.');
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Signing In...";

            const possibleEmails = buildPossibleEmails(phone);
            let loggedIn = false;
            let lastError = null;

            // Try each email format
            for (const email of possibleEmails) {
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    loggedIn = true;
                    console.log("✅ Logged in with:", email);
                    break;
                } catch (error) {
                    lastError = error;
                    console.log("❌ Failed:", email, "-", error.code);
                    
                    if (error.code === 'auth/wrong-password' || 
                        error.code === 'auth/user-not-found' || 
                        error.code === 'auth/invalid-credential' ||
                        error.code === 'auth/invalid-email') {
                        continue; // Try next format
                    } else if (error.code === 'auth/too-many-requests') {
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Sign In";
                        return showModal('error', 'Too Many Attempts', 'Too many failed attempts. Please wait a few minutes.');
                    } else {
                        throw error;
                    }
                }
            }

            if (loggedIn) {
                showModal('success', 'Login Successful', 'Welcome back to Nexfund! Redirecting to your dashboard...', true);
            } else {
                console.error("Login failed with all formats:", lastError);
                if (lastError && (lastError.code === 'auth/wrong-password' || lastError.code === 'auth/invalid-credential')) {
                    showModal('error', 'Login Failed', 'Incorrect phone number or password. Please try again.');
                } else if (lastError && lastError.code === 'auth/user-not-found') {
                    showModal('error', 'Account Not Found', 'No account found with this phone number. Please check and try again.');
                } else {
                    showModal('error', 'Login Failed', 'Incorrect phone number or password. Please try again.');
                }
                submitBtn.disabled = false;
                submitBtn.innerText = "Sign In";
            }
        });
    </script>
</body>
</html>
