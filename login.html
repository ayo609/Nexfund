<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexfund - Sign In</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Eye Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        .main-container {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow-y: auto;
        }

        .login-card {
            background: rgba(244, 245, 249, 0.96);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            margin: auto;
        }

        /* Header */
        .header-section { margin-bottom: 25px; }
        .logo-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .logo-img { width: 35px; height: 35px; object-fit: contain; }
        .brand-name { font-size: 18px; font-weight: 600; color: #1a1a1a; font-style: italic; }
        .title { font-family: 'Merriweather', serif; color: #1d3bba; font-size: 32px; font-weight: 700; letter-spacing: 0.5px; }

        /* Form Groups */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-family: 'Merriweather', serif; font-size: 15px; color: #333; margin-bottom: 8px; }
        
        .input-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
            background: #ffffff; 
            border-radius: 25px;
            padding: 0 15px; 
            height: 52px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        
        .phone-wrapper { padding-left: 0; }
        .country-code { 
            color: #00a896; 
            font-weight: 600; 
            font-size: 15px; 
            padding: 0 15px; 
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .country-code i { font-size: 10px; color: #666; }
        
        .input-wrapper input { width: 100%; border: none; outline: none; background: transparent; font-size: 15px; color: #333; }
        .input-wrapper input::placeholder { color: #a0a0a0; }
        
        .toggle-password { position: absolute; right: 20px; color: #1d3bba; cursor: pointer; font-size: 16px; }

        /* Forget Password */
        .forget-password-container {
            text-align: right;
            margin-bottom: 20px;
            margin-top: -10px;
        }
        .forget-password {
            color: #1d3bba;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        /* Button */
        .login-btn { 
            width: 100%; 
            background: #1d3bba; 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 30px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .login-btn:hover { background: #142ca3; }
        .login-btn:disabled { background: #7a8ad1; cursor: not-allowed; }

        /* Footer */
        .footer-text { text-align: center; margin-top: 25px; font-size: 13px; color: #333; }
        .signup-link { color: #1d3bba; text-decoration: none; font-weight: 500; }

        /* --- MODAL STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-box {
            background: #ffffff; padding: 30px; border-radius: 20px;
            width: 90%; max-width: 320px; text-align: center;
            transform: scale(0.8); transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-icon { font-size: 50px; margin-bottom: 15px; }
        .modal-icon.success { color: #00a896; }
        .modal-icon.error { color: #e74c3c; }

        .modal-title { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 600; margin-bottom: 10px; color: #1a1a1a; }
        .modal-message { font-size: 14px; color: #666; margin-bottom: 20px; }

        .modal-btn {
            width: 100%; background: #1d3bba; color: white; border: none;
            padding: 12px; border-radius: 15px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: 0.3s;
        }
        .modal-btn:hover { background: #142ca3; }

        @media (max-width: 400px) {
            .login-card { padding: 20px; }
            .title { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="login-card">
            
            <!-- Header Section -->
            <div class="header-section">
                <div class="logo-container">
                    <img src="logo.png" alt="Nexfund Logo" class="logo-img">
                    <span class="brand-name">Nexfund</span>
                </div>
                <h1 class="title">Sign In</h1>
            </div>

            <!-- Form Section -->
            <form id="loginForm">
                
                <!-- Phone Number -->
                <div class="input-group">
                    <label>Phone Number</label>
                    <div class="input-wrapper phone-wrapper">
                        <span class="country-code">+234 <i class="fa-solid fa-chevron-down"></i></span>
                        <input type="tel" id="phone" placeholder="Input phone number" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Input password" required>
                        <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePassword('password', this)"></i>
                    </div>
                </div>

                <!-- Forget Password -->
                <div class="forget-password-container">
                    <a href="forgot-password.html" class="forget-password">Forget the password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="login-btn">Sign In</button>
                
                <div class="footer-text">
                    Don't have an account? <a href="index.html" class="signup-link">Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Modal Component -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <i id="modalIcon" class="modal-icon"></i>
            <h2 class="modal-title" id="modalTitle">Title</h2>
            <p class="modal-message" id="modalMessage">Message goes here.</p>
            <button class="modal-btn" id="modalBtn">Okay</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // 1. Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBnGer9gGagzUmEkzwZnWhNGZ52WBL6vR0",
            authDomain: "nexfund-38027.firebaseapp.com",
            projectId: "nexfund-38027",
            storageBucket: "nexfund-38027.firebasestorage.app",
            messagingSenderId: "318202194753",
            appId: "1:318202194753:web:1bf7471c666acc50174fc0"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. Toggle Password Visibility
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.remove("fa-eye-slash");
                iconElement.classList.add("fa-eye");
            } else {
                input.type = "password";
                iconElement.classList.remove("fa-eye");
                iconElement.classList.add("fa-eye-slash");
            }
        }

        // 3. Modal Logic
        let redirectAfterModal = false;
        const modal = document.getElementById('customModal');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalBtn = document.getElementById('modalBtn');

        function showModal(type, title, message, shouldRedirect = false) {
            if (type === 'success') {
                modalIcon.className = 'modal-icon success fa-solid fa-circle-check';
            } else {
                modalIcon.className = 'modal-icon error fa-solid fa-circle-exclamation';
            }
            
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            redirectAfterModal = shouldRedirect;
            modal.classList.add('active');
        }

        modalBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            if (redirectAfterModal) {
                window.location.href = "dashboard.html"; 
            }
        });

        // 4. Handle Login Submission (Firestore-based)
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!phone || !password) {
                return showModal('error', 'Missing Fields', 'Please enter your phone number and password.');
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Signing In...";

            // Format phone for Firestore query (always with +234)
            let formattedPhone = phone;
            if (!phone.startsWith('+')) {
                if (phone.startsWith('0')) {
                    formattedPhone = `+234${phone.substring(1)}`;
                } else {
                    formattedPhone = `+234${phone}`;
                }
            }

            try {
                // ✅ STEP 1: Query Firestore for the user
                const snap = await db.collection("users").where("phoneNumber", "==", formattedPhone).get();
                
                if (snap.empty) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Sign In";
                    return showModal('error', 'Account Not Found', 'No account found with this phone number.');
                }

                const userDoc = snap.docs[0];
                const userData = userDoc.data();

                // ✅ STEP 2: Check password directly against Firestore
                if (userData.loginPassword !== password) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Sign In";
                    return showModal('error', 'Incorrect Password', 'The password you entered is incorrect. Please try again.');
                }

                // ✅ STEP 3: Store user ID for other pages
                localStorage.setItem("currentUserId", userDoc.id);
                localStorage.setItem("currentUserPhone", userData.phoneNumber);
                localStorage.setItem("currentUserCode", userData.myReferralCode || "");

                // ✅ STEP 4: Try to sync with Firebase Auth (optional, best effort)
                try {
                    // Try all email formats
                    const rawPhone = formattedPhone.replace(/\s+/g, '');
                    const possibleEmails = [
                        `${rawPhone.replace(/^\+/, '')}@nexfund.com`,
                        `${rawPhone}@nexfund.com`,
                        `${rawPhone.replace(/^\+234/, '0')}@nexfund.com`,
                        `${rawPhone.replace(/^\+234/, '')}@nexfund.com`
                    ];
                    
                    for (const email of possibleEmails) {
                        try {
                            await auth.signInWithEmailAndPassword(email, password);
                            console.log("✅ Synced with Firebase Auth:", email);
                            break;
                        } catch (err) {
                            continue;
                        }
                    }
                } catch (e) {
                    console.log("Firebase Auth sync skipped (not critical)");
                }

                // ✅ STEP 5: Show success and redirect
                showModal('success', 'Login Successful', 'Welcome back to Nexfund! Redirecting to your dashboard...', true);

            } catch (error) {
                console.error("Login Error:", error);
                showModal('error', 'Login Failed', 'An error occurred. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerText = "Sign In";
            }
        });
    </script>
</body>
</html>
