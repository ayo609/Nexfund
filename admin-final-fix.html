<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Fix - Force Active & Correct Dates</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f4f6fc; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
        h2 { color: #1d3bba; margin-top: 0; }
        p { font-size: 14px; color: #555; line-height: 1.6; }
        .btn { background: #00a896; color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; margin-bottom: 15px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #008f7f; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .log-box { background: #1e1e1e; color: #00ff00; padding: 20px; border-radius: 8px; height: 400px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.5; }
        .error { color: #ff5555; }
        .warning { color: #f1fa8c; }
        .success { color: #50fa7b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛠️ Final Fix: Restore & Activate</h2>
        <p>This script will safely find the 18 users who are missing their product records and create them as <b>ACTIVE</b> starting from today. It will not touch existing valid investments.</p>
        
        <button class="btn" id="fixBtn" onclick="runFinalFix()">Run Final Fix Now</button>
        
        <div class="log-box" id="logBox">Waiting to start...</div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // --- YOUR FIREBASE CONFIG ---
        const firebaseConfig = { 
            apiKey: "AIzaSyBnGer9gGagzUmEkzwZnWhNGZ52WBL6vR0", 
            authDomain: "nexfund-38027.firebaseapp.com", 
            projectId: "nexfund-38027", 
            storageBucket: "nexfund-38027.firebasestorage.app", 
            messagingSenderId: "318202194753", 
            appId: "1:318202194753:web:1bf7471c666acc50174fc0" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- YOUR PRODUCTS LIST ---
        const PRODUCTS = {
            p1: { name: 'Nexfund A', duration: 2,  price: 6000,  totalReturn: 8400 },
            p2: { name: 'Nexfund B', duration: 5,  price: 13000, totalReturn: 18850 },
            p3: { name: 'Nexfund C', duration: 10, price: 24000, totalReturn: 35500 },
            p4: { name: 'Nexfund D', duration: 20, price: 42000, totalReturn: 63000 },
            p5: { name: 'Nexfund E', duration: 30, price: 65000, totalReturn: 129350 },
            p6: { name: 'Nexfund F', duration: 40, price: 95000, totalReturn: 209000 }
        };

        function log(message, type = '') {
            const box = document.getElementById('logBox');
            if (box.innerHTML === 'Waiting to start...') box.innerHTML = '';
            box.innerHTML += `<div class="${type}">> ${message}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        async function runFinalFix() {
            if(!confirm("Are you sure you want to run the final fix? This will create active investments for missing users.")) return;
            
            const btn = document.getElementById('fixBtn');
            btn.disabled = true;
            btn.innerText = "Processing... Do not close this page.";
            document.getElementById('logBox').innerHTML = '';

            log("Fetching all users...", 'warning');
            const usersSnap = await db.collection("users").get();
            
            log("Fetching existing investments to prevent duplicates...", 'warning');
            const invSnap = await db.collection("investments").get();
            
            // Create a Set of userIds that ALREADY have investments
            const usersWithInvestments = new Set();
            invSnap.forEach(doc => {
                if(doc.data().userId) usersWithInvestments.add(doc.data().userId);
            });

            let restoredUsers = 0;
            let totalInvestmentsCreated = 0;
            const rightNow = new Date(); // Sets start date to today

            log("Scanning user profiles...", 'warning');
            
            for (const userDoc of usersSnap.docs) {
                const userData = userDoc.data();
                const userId = userDoc.id;
                const phone = userData.phoneNumber || 'Unknown Phone';

                // Skip user if they already have investments (prevents duplicates)
                if (usersWithInvestments.has(userId)) continue;

                const purchased = userData.purchasedProducts || {};
                const totalPurchased = Object.values(purchased).reduce((sum, c) => sum + (Number(c) || 0), 0);
                
                // Skip if they never purchased anything
                if (totalPurchased === 0) continue;

                log(`Found missing records for: ${phone}`, 'warning');
                const batch = db.batch();
                let createdForThisUser = 0;

                for (const [pid, count] of Object.entries(purchased)) {
                    const product = PRODUCTS[pid];
                    if (!product || count <= 0) continue;

                    for (let i = 0; i < count; i++) {
                        // Calculate expiry starting from RIGHT NOW (Today)
                        const expiryDate = new Date(rightNow);
                        expiryDate.setDate(expiryDate.getDate() + product.duration);

                        const newInvRef = db.collection("investments").doc();
                        batch.set(newInvRef, {
                            userId: userId,
                            productId: pid,
                            productName: product.name,
                            amount: product.price,
                            duration: product.duration,
                            expectedReturn: product.totalReturn,
                            status: 'active', // FORCE ACTIVE
                            purchaseDate: firebase.firestore.Timestamp.fromDate(rightNow),
                            expiryDate: firebase.firestore.Timestamp.fromDate(expiryDate),
                            restoredByAdmin: true // Tag for tracking
                        });
                        createdForThisUser++;
                    }
                }

                // Commit to database
                if (createdForThisUser > 0) {
                    await batch.commit();
                    log(`✅ Created ${createdForThisUser} ACTIVE products for ${phone}`, 'success');
                    restoredUsers++;
                    totalInvestmentsCreated += createdForThisUser;
                }
            }

            log(`\n--- FINAL FIX COMPLETE ---`, 'success');
            log(`Users Fixed: ${restoredUsers}`);
            log(`Total Active Investments Created: ${totalInvestmentsCreated}`, 'success');
            log(`Action Required: Tell the affected users to refresh or re-login to their dashboards.`, 'warning');
            
            btn.disabled = false;
            btn.innerText = "Run Final Fix Now";
        }
    </script>
</body>
</html>
