<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexfund - Create/Recover Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #1d3bba;
            --dark-blue: #0f2563;
            --card-bg: #ffffff;
            --text-dark: #222;
            --text-gray: #666;
            --success: #00a896;
            --warning: #f39c12;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--primary-blue) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 25px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
        }

        .dev-icon {
            width: 70px; height: 70px;
            background: #eef2ff;
            color: var(--primary-blue);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px;
            margin: 0 auto 20px auto;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-gray);
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #a0aec0;
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            background: #f8fafc;
            transition: 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-blue);
            background: #ffffff;
        }

        .create-btn {
            width: 100%;
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .create-btn:disabled { background: #8a9de8; cursor: not-allowed; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: 0.3s;
            padding: 20px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .success-box {
            background: #fff;
            width: 100%;
            max-width: 350px;
            border-radius: 25px;
            padding: 30px 25px;
            text-align: center;
            transform: translateY(20px);
            transition: 0.3s;
        }
        .modal-overlay.active .success-box { transform: translateY(0); }

        .success-icon {
            font-size: 55px;
            color: var(--success);
            margin-bottom: 15px;
        }
        .success-box h3 { font-size: 18px; color: var(--text-dark); margin-bottom: 5px; }
        .success-box p { font-size: 13px; color: var(--text-gray); margin-bottom: 20px; }

        .credential-box {
            background: #f8fafc;
            border: 1px dashed var(--primary-blue);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        .cred-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .cred-row:last-child { margin-bottom: 0; }
        .cred-label { color: var(--text-gray); font-weight: 500; }
        .cred-value { font-weight: 700; color: var(--text-dark); font-family: monospace; font-size: 15px; letter-spacing: 1px; }

        .btn-row { display: flex; flex-direction: column; gap: 10px; }
        
        .copy-btn {
            width: 100%; background: #eef2ff; color: var(--primary-blue);
            border: none; padding: 14px; border-radius: 12px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            transition: 0.2s;
        }
        .copy-btn:active { transform: scale(0.97); }

        .done-btn {
            width: 100%; background: var(--primary-blue); color: white;
            border: none; padding: 14px; border-radius: 12px;
            font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .done-btn:active { transform: scale(0.97); }

        /* Toast */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(231, 76, 60, 0.95); color: white; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; opacity: 0; transition: 0.3s; z-index: 2000; pointer-events: none; text-align: center; width: max-content; max-width: 90%; }
        .toast.success { background: rgba(0, 168, 150, 0.95); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="card">
        <div class="dev-icon"><i class="fa-solid fa-user-cog"></i></div>
        <h1 class="title">Create / Recover Admin</h1>
        <p class="subtitle">Enter a phone number to generate a new admin or recover an existing one.</p>

        <form id="createAdminForm">
            <div class="input-group">
                <label>Full Name (Only for new admins)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="adminName" placeholder="e.g. John Doe">
                </div>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="adminPhone" placeholder="e.g. 08012345678" required>
                </div>
            </div>

            <button type="submit" id="createBtn" class="create-btn">Check & Proceed</button>
        </form>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="successModal">
        <div class="success-box">
            <i class="fa-solid fa-circle-check success-icon" id="modalIcon"></i>
            <h3 id="modalTitle">Admin Created!</h3>
            <p id="modalDesc">Please copy these credentials.</p>

            <div class="credential-box">
                <div class="cred-row">
                    <span class="cred-label">Phone:</span>
                    <span class="cred-value" id="resPhone">-</span>
                </div>
                <div class="cred-row">
                    <span class="cred-label">Password:</span>
                    <span class="cred-value" id="resPassword">-</span>
                </div>
            </div>

            <div class="btn-row">
                <button class="copy-btn" onclick="copyCredentials()">
                    <i class="fa-regular fa-copy"></i> Copy Details
                </button>
                <button class="done-btn" onclick="closeModal()">Done</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Message</div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // 1. FIREBASE INIT
        const firebaseConfig = {
            apiKey: "AIzaSyBnGer9gGagzUmEkzwZnWhNGZ52WBL6vR0",
            authDomain: "nexfund-38027.firebaseapp.com",
            projectId: "nexfund-38027",
            storageBucket: "nexfund-38027.firebasestorage.app",
            messagingSenderId: "318202194753",
            appId: "1:318202194753:web:1bf7471c666acc50174fc0"
        };
        
        // Secondary App for creating users without logging out the developer
        const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary");
        const secondaryAuth = secondaryApp.auth();
        
        // Primary App for Firestore queries
        const primaryApp = firebase.apps.length > 0 && firebase.apps[0].name !== "[DEFAULT]" ? firebase.apps[0] : firebase.initializeApp(firebaseConfig);
        const db = primaryApp.firestore();

        let currentCreatedPhone = "";
        let currentCreatedPassword = "";
        let isNewCreation = false;

        // 2. HELPERS
        function showToast(message, isSuccess = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = 'toast show' + (isSuccess ? ' success' : '');
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        function generatePassword() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
            let pass = "";
            for (let i = 0; i < 6; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return `Nxf-${pass}`;
        }

        // 3. CREATE/RECOVER LOGIC
        document.getElementById('createAdminForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('adminName').value.trim();
            const phone = document.getElementById('adminPhone').value.trim();
            const btn = document.getElementById('createBtn');

            if (phone.length < 10) return showToast("Please enter a valid phone number.");
            
            btn.disabled = true;
            btn.innerText = "Checking Database...";

            let formattedPhone = phone;
            if (!phone.startsWith('+')) formattedPhone = `+234${phone}`;
            const authEmail = `${formattedPhone.replace(/\s+/g, '')}@nexfund.com`;
            
            try {
                // --- STEP 1: CHECK IF USER EXISTS IN FIRESTORE ---
                // We query by phoneNumber instead of email, since we save formattedPhone
                const existingUserQuery = await db.collection("users").where("phoneNumber", "==", formattedPhone).get();

                if (!existingUserQuery.empty) {
                    // USER EXISTS! Recover their password.
                    const userData = existingUserQuery.docs[0].data();
                    
                    currentCreatedPhone = userData.phoneNumber;
                    currentCreatedPassword = userData.loginPassword || "Password not saved.";
                    isNewCreation = false;

                    // Show Modal
                    document.getElementById('modalIcon').className = "fa-solid fa-key success-icon";
                    document.getElementById('modalIcon').style.color = "var(--warning)";
                    document.getElementById('modalTitle').innerText = "Admin Recovered";
                    document.getElementById('modalDesc').innerText = "This admin already exists. Here are their login details:";
                    document.getElementById('resPhone').innerText = currentCreatedPhone;
                    document.getElementById('resPassword').innerText = currentCreatedPassword;
                    document.getElementById('successModal').classList.add('active');

                } else {
                    // USER DOES NOT EXIST. CREATE NEW ADMIN.
                    if (!name) {
                        btn.disabled = false;
                        btn.innerText = "Check & Proceed";
                        return showToast("Please enter a Full Name for the new admin.");
                    }

                    btn.innerText = "Generating Account...";
                    const generatedPassword = generatePassword();
                    const userReferralCode = "ADM" + formattedPhone.slice(-5); 

                    // 1. Create in Firebase Auth
                    const userCredential = await secondaryAuth.createUserWithEmailAndPassword(authEmail, generatedPassword);
                    const user = userCredential.user;

                    // 2. Save to Firestore
                    await db.collection("users").doc(user.uid).set({
                        uid: user.uid,
                        name: name,
                        phoneNumber: formattedPhone,
                        loginPassword: generatedPassword,
                        fundPassword: generatedPassword,
                        referredBy: "DIRECT",
                        myReferralCode: userReferralCode,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        role: "admin",
                        isAdmin: true,
                        depositWallet: 0,
                        withdrawalWallet: 0,
                        totalInvested: 0,
                        purchasedProducts: {}
                    });

                    // 3. Log out secondary app
                    await secondaryAuth.signOut();

                    currentCreatedPhone = formattedPhone;
                    currentCreatedPassword = generatedPassword;
                    isNewCreation = true;

                    // Show Modal
                    document.getElementById('modalIcon').className = "fa-solid fa-circle-check success-icon";
                    document.getElementById('modalIcon').style.color = "var(--success)";
                    document.getElementById('modalTitle').innerText = "Admin Created!";
                    document.getElementById('modalDesc').innerText = "Please copy these credentials and send them to the new admin.";
                    document.getElementById('resPhone').innerText = currentCreatedPhone;
                    document.getElementById('resPassword').innerText = currentCreatedPassword;
                    document.getElementById('successModal').classList.add('active');
                }

            } catch (error) {
                console.error("Error:", error);
                try { await secondaryAuth.signOut(); } catch(e) {}
                
                if (error.code === 'auth/email-already-in-use') {
                    showToast("Auth conflict: This phone is in Firebase Auth but missing from Firestore. Contact Support.");
                } else {
                    showToast(error.message);
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "Check & Proceed";
            }
        });

        // 4. COPY CREDENTIALS
        function copyCredentials() {
            const textToCopy = `Admin Login Details:\nPhone: ${currentCreatedPhone}\nPassword: ${currentCreatedPassword}\nLogin Link: ${window.location.origin}/admin-login.html`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast("Details copied to clipboard!", true);
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast("Details copied!", true);
            });
        }

        // 5. CLOSE MODAL
        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            if (isNewCreation) {
                document.getElementById('createAdminForm').reset();
            }
        }
    </script>
</body>
</html>
