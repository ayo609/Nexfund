<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexfund - ROI Audit & User Manager</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #1d3bba;
            --dark-blue: #16285c;
            --light-bg: #f4f6fc;
            --text-dark: #222;
            --text-gray: #666;
            --success: #00a896;
            --danger: #e74c3c;
            --warning: #f39c12;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--light-bg); min-height: 100vh; padding: 20px; padding-bottom: 50px; }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--dark-blue); font-size: 22px; margin-bottom: 5px; }
        .header p { color: var(--text-gray); font-size: 13px; }

        .search-card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; }
        .input-group input {
            flex: 1; padding: 15px; border: 1px solid #e2e8f0; border-radius: 10px;
            font-size: 14px; outline: none;
        }
        .input-group input:focus { border-color: var(--primary-blue); }
        .input-group button {
            background: var(--primary-blue); color: white; border: none;
            padding: 0 20px; border-radius: 10px; font-weight: 600; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .input-group button:disabled { background: #ccc; cursor: not-allowed; }

        .results-card { background: #fff; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; display: none; margin-bottom: 20px;}
        .results-header { background: var(--dark-blue); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .results-header h3 { font-size: 15px; }
        .results-body { padding: 20px; }

        .user-summary { background: #f8fafc; border-radius: 10px; padding: 15px; margin-bottom: 20px; border-left: 4px solid var(--primary-blue); }
        .user-summary p { font-size: 13px; margin-bottom: 5px; color: var(--text-gray); }
        .user-summary strong { color: var(--text-dark); }

        .audit-item { border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; overflow: hidden; }
        .audit-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
        .audit-header.danger { background: #fadbd8; color: #b91c1c; }
        .audit-header.warning { background: #fff3cd; color: #856404; }
        .audit-header.info { background: #e2e8ff; color: var(--primary-blue); }
        .audit-body { padding: 15px; background: #fff; font-size: 12px; color: var(--text-gray); }
        .audit-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px dashed #f0f0f0; padding-bottom: 8px; }
        .audit-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .audit-row strong { color: var(--text-dark); }

        /* TRANSACTIONS SECTION */
        .section-title { font-size: 14px; font-weight: 700; color: var(--primary-blue); margin-bottom: 10px; text-transform: uppercase; border-bottom: 2px solid #eef2ff; padding-bottom: 5px; }
        .tx-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; max-height: 400px; overflow-y: auto; padding-right: 5px;}
        .tx-item { background: #fff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .tx-info { display: flex; flex-direction: column; }
        .tx-title { font-weight: 700; font-size: 13px; color: var(--text-dark); text-transform: capitalize; }
        .tx-date { font-size: 11px; color: var(--text-gray); margin-top: 2px; }
        .tx-amount { font-weight: 700; font-size: 14px; }
        .tx-amount.positive { color: var(--success); }
        .tx-amount.negative { color: var(--danger); }
        .tx-status { font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }
        .tx-status.success, .tx-status.approved { background: #e8f8f5; color: var(--success); }
        .tx-status.pending { background: #fff3cd; color: #856404; }
        .tx-status.rejected { background: #fadbd8; color: var(--danger); }

        /* WALLET MANAGEMENT */
        .wallet-card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid var(--primary-blue); }
        .wallet-balance-box { background: #eef2ff; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; }
        .wallet-balance-box span { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 5px; }
        .wallet-balance-box h2 { font-size: 24px; color: var(--primary-blue); }
        
        .adjust-form { display: flex; flex-direction: column; gap: 10px; }
        .adjust-form select, .adjust-form input {
            width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none;
        }
        .adjust-form button {
            background: var(--primary-blue); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer;
        }

        /* ✅ NEW: Auto Credit Button */
        .credit-roi-btn {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 168, 150, 0.3);
            transition: 0.2s;
        }
        .credit-roi-btn:active { transform: scale(0.98); }
        .credit-roi-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        .empty-state { text-align: center; padding: 30px; color: var(--text-gray); font-size: 14px; }
        .empty-state i { font-size: 40px; color: var(--success); margin-bottom: 10px; }

        .spinner { width: 30px; height: 30px; border: 3px solid #e2e8f0; border-top-color: var(--primary-blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,168,150,0.95); color: white; padding: 12px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 2000; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; }
        .toast.show { opacity: 1; }
        .toast.error { background: rgba(231,76,60,0.95); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🕵️‍♂️ ROI Audit & Wallet Manager</h1>
            <p>Search a user to check for missed ROIs, view all transactions, and fund wallets.</p>
        </div>

        <div class="search-card">
            <div class="input-group">
                <input type="text" id="searchPhone" placeholder="Enter user's phone number...">
                <button id="searchBtn" onclick="runDeepScan()"><i class="fa-solid fa-search"></i> Scan</button>
            </div>
        </div>

        <!-- AUDIT RESULTS -->
        <div class="results-card" id="resultsCard">
            <div class="results-header">
                <h3><i class="fa-solid fa-clipboard-list"></i> Audit Results</h3>
                <span id="resultCount" style="font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px;">0 Found</span>
            </div>
            <div class="results-body" id="resultsBody">
                <!-- Results injected here -->
            </div>
        </div>

        <!-- TRANSACTIONS -->
        <div class="results-card" id="txCard">
            <div class="results-header" style="background: var(--primary-blue);">
                <h3><i class="fa-solid fa-receipt"></i> All Transactions (<span id="txCount">0</span>)</h3>
            </div>
            <div class="results-body" id="txBody">
                <!-- Transactions injected here -->
            </div>
        </div>

        <!-- WALLET MANAGEMENT -->
        <div class="wallet-card" id="walletCard" style="display: none;">
            <h3 class="section-title">Manage Withdrawal Wallet</h3>
            <div class="wallet-balance-box">
                <span>Current Withdrawal Balance</span>
                <h2 id="currentWalletBalance">₦0</h2>
            </div>
            <div class="adjust-form">
                <select id="actionType">
                    <option value="add">Add Funds (+)</option>
                    <option value="deduct">Deduct Funds (-)</option>
                </select>
                <input type="number" id="amountInput" placeholder="Enter amount (e.g. 5000)">
                <button onclick="processWalletAdjustment()">Apply Adjustment</button>
            </div>
        </div>

    </div>

    <div class="toast" id="toast">Message</div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBnGer9gGagzUmEkzwZnWhNGZ52WBL6vR0", 
            authDomain: "nexfund-38027.firebaseapp.com", 
            projectId: "nexfund-38027", 
            storageBucket: "nexfund-38027.firebasestorage.app", 
            messagingSenderId: "318202194753", 
            appId: "1:318202194753:web:1bf7471c666acc50174fc0" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentAuditUser = null;

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ✅ FORMAT: Exact Date and Time with AM/PM
        function formatDateTime(ts) {
            if (!ts) return 'Unknown';
            try {
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                if (isNaN(d.getTime())) return 'Invalid Date';
                const date = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                const time = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                return `${date} at ${time}`;
            } catch (e) { return 'Error'; }
        }

        async function runDeepScan() {
            const phoneInput = document.getElementById('searchPhone').value.trim();
            if (!phoneInput) return alert("Please enter a phone number.");

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Scanning...';
            
            const resultsCard = document.getElementById('resultsCard');
            const resultsBody = document.getElementById('resultsBody');
            const resultCount = document.getElementById('resultCount');
            
            // Hide other cards initially
            document.getElementById('txCard').style.display = 'none';
            document.getElementById('walletCard').style.display = 'none';
            
            resultsCard.style.display = 'block';
            resultsBody.innerHTML = '<div class="spinner"></div><p style="text-align:center; font-size:12px; color:#666;">Deep scanning database...</p>';

            try {
                // 1. Find User
                let userSnap = await db.collection("users").where("phoneNumber", "==", phoneInput).get();
                if (userSnap.empty) {
                    const altPhone = phoneInput.startsWith('0') ? '+234' + phoneInput.substring(1) : phoneInput;
                    userSnap = await db.collection("users").where("phoneNumber", "==", altPhone).get();
                }

                if (userSnap.empty) {
                    resultsBody.innerHTML = `<div class="empty-state"><i class="fa-solid fa-user-slash"></i><p>User not found with that phone number.</p></div>`;
                    resultCount.innerText = "0 Found";
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-search"></i> Scan';
                    return;
                }

                const userDoc = userSnap.docs[0];
                const userData = userDoc.data();
                const userId = userDoc.id;
                currentAuditUser = { id: userId, ...userData }; // Save for wallet adjustment

                // 2. Fetch Investments
                const invSnap = await db.collection("investments").where("userId", "==", userId).get();
                const investments = [];
                invSnap.forEach(doc => investments.push({ id: doc.id, ...doc.data() }));

                // 3. Fetch ALL Transactions
                const txSnap = await db.collection("transactions").where("userId", "==", userId).get();
                const transactions = [];
                txSnap.forEach(doc => transactions.push({ id: doc.id, ...doc.data() }));
                transactions.sort((a, b) => {
                    const tA = a.timestamp ? a.timestamp.toMillis() : 0;
                    const tB = b.timestamp ? b.timestamp.toMillis() : 0;
                    return tB - tA;
                });

                // 4. Run Deep Scan Logic
                const issues = [];
                let totalMissedROI = 0;
                const missedInvIds = []; // Track IDs to update status later
                const now = new Date();

                investments.forEach(inv => {
                    let isIssue = false;
                    if (inv.status === 'active' && inv.expiryDate) {
                        const exp = inv.expiryDate.toDate ? inv.expiryDate.toDate() : new Date(inv.expiryDate);
                        if (exp < now) {
                            isIssue = true;
                            issues.push({ 
                                type: 'Missed Payout (Ghost Active)', 
                                level: 'danger', 
                                product: inv.productName, 
                                amount: inv.amount, 
                                expected: inv.expectedReturn, 
                                purchaseDate: inv.purchaseDate,
                                expiryDate: exp, 
                                msg: 'This product expired, but the system did not pay the user. They are owed this ROI.' 
                            });
                        }
                    } else if (inv.status === 'expired_unpaid') {
                        isIssue = true;
                        issues.push({ 
                            type: 'Tagged Expired (No Payout)', 
                            level: 'warning', 
                            product: inv.productName, 
                            amount: inv.amount, 
                            expected: inv.expectedReturn, 
                            purchaseDate: inv.purchaseDate,
                            expiryDate: inv.expiryDate ? (inv.expiryDate.toDate ? inv.expiryDate.toDate() : new Date(inv.expiryDate)) : null, 
                            msg: 'Admin script marked this as expired_unpaid. Verify if they actually missed their payout.' 
                        });
                    }

                    if (isIssue) {
                        totalMissedROI += (Number(inv.expectedReturn) || 0);
                        missedInvIds.push(inv.id);
                    }
                });

                const purchased = userData.purchasedProducts || {};
                const totalPurchased = Object.values(purchased).reduce((sum, c) => sum + (Number(c) || 0), 0);
                if (totalPurchased > 0 && investments.length === 0) {
                    issues.push({ type: 'Missing Records Entirely', level: 'danger', product: Object.keys(purchased).join(', '), amount: 'N/A', expected: 'N/A', purchaseDate: null, expiryDate: null, msg: 'User has purchased products on their profile, but ZERO investment records exist. They missed everything.' });
                }

                // 5. Render Audit Results
                resultCount.innerText = `${issues.length} Found`;
                let html = `
                    <div class="user-summary">
                        <p><strong>Phone:</strong> ${userData.phoneNumber || 'N/A'}</p>
                        <p><strong>Referral Code:</strong> ${userData.myReferralCode || 'N/A'}</p>
                        <p><strong>Deposit Wallet:</strong> ₦${(userData.depositWallet || 0).toLocaleString()}</p>
                        <p><strong>Withdrawal Wallet:</strong> ₦${(userData.withdrawalWallet || 0).toLocaleString()}</p>
                        <p><strong>Total Investments Found:</strong> ${investments.length}</p>
                    </div>
                `;

                if (issues.length === 0) {
                    html += `<div class="empty-state"><i class="fa-solid fa-circle-check"></i><p>Perfect! This user has no missed ROIs or missing records.</p></div>`;
                } else {
                    issues.forEach(issue => {
                        html += `
                            <div class="audit-item">
                                <div class="audit-header ${issue.level}"><span>${issue.type}</span><i class="fa-solid fa-triangle-exclamation"></i></div>
                                <div class="audit-body">
                                    <div class="audit-row"><span>Product:</span> <strong>${issue.product || 'Unknown'}</strong></div>
                                    <div class="audit-row"><span>Invested:</span> <strong>₦${(issue.amount || 0).toLocaleString()}</strong></div>
                                    <div class="audit-row"><span>Expected ROI:</span> <strong style="color:var(--success)">₦${(issue.expected || 0).toLocaleString()}</strong></div>
                                    <div class="audit-row"><span>Date Invested:</span> <strong>${issue.purchaseDate ? formatDateTime(issue.purchaseDate) : 'N/A'}</strong></div>
                                    <div class="audit-row"><span>Date Expired:</span> <strong>${issue.expiryDate ? formatDateTime(issue.expiryDate) : 'N/A'}</strong></div>
                                    <div style="margin-top:10px; padding:10px; background:#f8fafc; border-radius:8px; color:#333; font-style:italic;">
                                        <i class="fa-solid fa-circle-info" style="color:var(--primary-blue)"></i> ${issue.msg}
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    // ✅ Add the Credit Total ROI Button if there is a calculated ROI
                    if (totalMissedROI > 0) {
                        html += `
                            <button class="credit-roi-btn" id="creditRoiBtn" onclick="creditTotalROI(${totalMissedROI}, [${missedInvIds.map(id => `'${id}'`).join(',')}])">
                                <i class="fa-solid fa-money-bill-transfer"></i> Credit Total ROI (₦${totalMissedROI.toLocaleString()}) to Wallet
                            </button>
                        `;
                    }
                }
                resultsBody.innerHTML = html;

                // 6. Render ALL Transactions
                document.getElementById('txCard').style.display = 'block';
                document.getElementById('txCount').innerText = transactions.length;
                const txBody = document.getElementById('txBody');
                
                if (transactions.length === 0) {
                    txBody.innerHTML = `<div class="empty-state"><p>No transactions found for this user.</p></div>`;
                } else {
                    txBody.innerHTML = `<div class="tx-list">` + transactions.map(t => {
                        const moneyInTypes = ['deposit', 'income', 'roi', 'commission', 'checkin', 'salary'];
                        const isMoneyIn = moneyInTypes.includes(t.type);
                        const amountClass = isMoneyIn ? 'positive' : 'negative';
                        const sign = isMoneyIn ? '+' : '-';
                        const status = t.status || 'success';
                        const title = t.type.charAt(0).toUpperCase() + t.type.slice(1);
                        
                        return `
                            <div class="tx-item">
                                <div class="tx-info">
                                    <span class="tx-title">${title}</span>
                                    <span class="tx-date">${formatDateTime(t.timestamp)}</span>
                                    <span class="tx-status ${status}">${status}</span>
                                </div>
                                <div class="tx-amount ${amountClass}">${sign}₦${(t.amount || 0).toLocaleString()}</div>
                            </div>
                        `;
                    }).join('') + `</div>`;
                }

                // 7. Setup Wallet Management
                document.getElementById('walletCard').style.display = 'block';
                document.getElementById('currentWalletBalance').innerText = `₦${(userData.withdrawalWallet || 0).toLocaleString()}`;
                document.getElementById('amountInput').value = ''; 

            } catch (error) {
                console.error(error);
                resultsBody.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger)"></i><p>Error searching database.</p></div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-search"></i> Scan';
            }
        }

        // ✅ NEW: Auto Credit Total ROI Function
        async function creditTotalROI(amount, invIds) {
            if (!currentAuditUser) return;
            
            if (!confirm(`Are you sure you want to credit ₦${amount.toLocaleString()} to this user's Withdrawal Wallet and mark their missed investments as completed?`)) return;

            const btn = document.getElementById('creditRoiBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Crediting...';

            try {
                const batch = db.batch();
                const userRef = db.collection("users").doc(currentAuditUser.id);

                // 1. Add money to Withdrawal Wallet
                batch.update(userRef, {
                    "withdrawalWallet": firebase.firestore.FieldValue.increment(amount)
                });

                // 2. Mark the missed investments as completed so they don't get paid again
                invIds.forEach(id => {
                    const invRef = db.collection("investments").doc(id);
                    batch.update(invRef, { status: 'completed' });
                });

                // 3. Add a transaction record so it shows in their history
                const txRef = db.collection("transactions").doc();
                batch.set(txRef, {
                    userId: currentAuditUser.id,
                    type: 'roi',
                    amount: amount,
                    status: 'success',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    note: 'Manual ROI Payout by Admin'
                });

                await batch.commit();

                showToast(`Successfully credited ₦${amount.toLocaleString()}!`, false);
                
                // Update the screen to reflect the new balance and clear the button
                currentAuditUser.withdrawalWallet = (currentAuditUser.withdrawalWallet || 0) + amount;
                document.getElementById('currentWalletBalance').innerText = `₦${currentAuditUser.withdrawalWallet.toLocaleString()}`;
                
                // Remove the button so they can't click it twice
                btn.style.display = 'none';
                
                // Optional: Re-run scan automatically after 2 seconds to show clean state
                setTimeout(() => {
                    runDeepScan();
                }, 2000);

            } catch (error) {
                console.error("Credit error:", error);
                showToast("Failed to credit ROI.", true);
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-money-bill-transfer"></i> Credit Total ROI (₦${amount.toLocaleString()})`;
            }
        }

        // ✅ Process Manual Wallet Adjustment
        async function processWalletAdjustment() {
            if (!currentAuditUser) return showToast("No user selected.", true);

            const action = document.getElementById('actionType').value;
            const amount = parseFloat(document.getElementById('amountInput').value);

            if (!amount || amount <= 0) return showToast("Enter a valid amount.", true);

            const finalAmount = action === 'add' ? amount : -amount;
            const actionText = action === 'add' ? 'ADD' : 'DEDUCT';

            if (!confirm(`Are you sure you want to ${actionText} ₦${amount.toLocaleString()} to this user's Withdrawal Wallet?`)) return;

            try {
                await db.collection("users").doc(currentAuditUser.id).update({
                    "withdrawalWallet": firebase.firestore.FieldValue.increment(finalAmount)
                });

                showToast(`Wallet updated successfully!`, false);
                
                const newBalance = (currentAuditUser.withdrawalWallet || 0) + finalAmount;
                currentAuditUser.withdrawalWallet = newBalance;
                document.getElementById('currentWalletBalance').innerText = `₦${newBalance.toLocaleString()}`;
                document.getElementById('amountInput').value = '';

            } catch (error) {
                console.error("Adjustment error:", error);
                showToast("Failed to adjust wallet.", true);
            }
        }
    </script>
</body>
</html>
