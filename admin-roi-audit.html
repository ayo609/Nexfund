<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexfund - ROI Audit Tool</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #1d3bba;
            --dark-blue: #16285c;
            --light-bg: #f4f6fc;
            --text-dark: #222;
            --text-gray: #666;
            --success: #00a896;
            --danger: #e74c3c;
            --warning: #f39c12;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--light-bg); min-height: 100vh; padding: 20px; }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--dark-blue); font-size: 22px; margin-bottom: 5px; }
        .header p { color: var(--text-gray); font-size: 13px; }

        .search-card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; }
        .input-group input {
            flex: 1; padding: 15px; border: 1px solid #e2e8f0; border-radius: 10px;
            font-size: 14px; outline: none;
        }
        .input-group input:focus { border-color: var(--primary-blue); }
        .input-group button {
            background: var(--primary-blue); color: white; border: none;
            padding: 0 20px; border-radius: 10px; font-weight: 600; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .input-group button:disabled { background: #ccc; cursor: not-allowed; }

        .results-card { background: #fff; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; display: none; }
        .results-header { background: var(--dark-blue); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .results-header h3 { font-size: 15px; }
        .results-body { padding: 20px; }

        .user-summary { background: #f8fafc; border-radius: 10px; padding: 15px; margin-bottom: 20px; border-left: 4px solid var(--primary-blue); }
        .user-summary p { font-size: 13px; margin-bottom: 5px; color: var(--text-gray); }
        .user-summary strong { color: var(--text-dark); }

        .audit-item { border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; overflow: hidden; }
        .audit-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
        .audit-header.danger { background: #fadbd8; color: #b91c1c; }
        .audit-header.warning { background: #fff3cd; color: #856404; }
        .audit-header.info { background: #e2e8ff; color: var(--primary-blue); }
        .audit-body { padding: 15px; background: #fff; font-size: 12px; color: var(--text-gray); }
        .audit-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px dashed #f0f0f0; padding-bottom: 8px; }
        .audit-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .audit-row strong { color: var(--text-dark); }

        .empty-state { text-align: center; padding: 30px; color: var(--text-gray); font-size: 14px; }
        .empty-state i { font-size: 40px; color: var(--success); margin-bottom: 10px; }

        .spinner { width: 30px; height: 30px; border: 3px solid #e2e8f0; border-top-color: var(--primary-blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🕵️‍♂️ ROI Audit Tool</h1>
            <p>Search for a user to find missed or unpaid ROIs.</p>
        </div>

        <div class="search-card">
            <div class="input-group">
                <input type="text" id="searchPhone" placeholder="Enter user's phone number...">
                <button id="searchBtn" onclick="runDeepScan()"><i class="fa-solid fa-search"></i> Scan</button>
            </div>
        </div>

        <div class="results-card" id="resultsCard">
            <div class="results-header">
                <h3><i class="fa-solid fa-clipboard-list"></i> Audit Results</h3>
                <span id="resultCount" style="font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px;">0 Found</span>
            </div>
            <div class="results-body" id="resultsBody">
                <!-- Results injected here -->
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBnGer9gGagzUmEkzwZnWhNGZ52WBL6vR0", 
            authDomain: "nexfund-38027.firebaseapp.com", 
            projectId: "nexfund-38027", 
            storageBucket: "nexfund-38027.firebasestorage.app", 
            messagingSenderId: "318202194753", 
            appId: "1:318202194753:web:1bf7471c666acc50174fc0" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function formatDate(ts) {
            if (!ts) return 'Unknown';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        async function runDeepScan() {
            const phoneInput = document.getElementById('searchPhone').value.trim();
            if (!phoneInput) return alert("Please enter a phone number.");

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Scanning...';
            
            const resultsCard = document.getElementById('resultsCard');
            const resultsBody = document.getElementById('resultsBody');
            const resultCount = document.getElementById('resultCount');
            
            resultsCard.style.display = 'block';
            resultsBody.innerHTML = '<div class="spinner"></div><p style="text-align:center; font-size:12px; color:#666;">Deep scanning database...</p>';

            try {
                // 1. Find the user by phone number
                // Try with exact match first, then maybe try without spaces
                let userSnap = await db.collection("users").where("phoneNumber", "==", phoneInput).get();
                
                if (userSnap.empty) {
                    // Try searching with the +234 format if they entered 080...
                    const altPhone = phoneInput.startsWith('0') ? '+234' + phoneInput.substring(1) : phoneInput;
                    userSnap = await db.collection("users").where("phoneNumber", "==", altPhone).get();
                }

                if (userSnap.empty) {
                    resultsBody.innerHTML = `<div class="empty-state"><i class="fa-solid fa-user-slash"></i><p>User not found with that phone number.</p></div>`;
                    resultCount.innerText = "0 Found";
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-search"></i> Scan';
                    return;
                }

                const userDoc = userSnap.docs[0];
                const userData = userDoc.data();
                const userId = userDoc.id;

                // 2. Fetch their investments
                const invSnap = await db.collection("investments").where("userId", "==", userId).get();
                const investments = [];
                invSnap.forEach(doc => investments.push({ id: doc.id, ...doc.data() }));

                // 3. Run the Deep Scan Logic
                const issues = [];
                const now = new Date();

                // Check A: Ghost Active (Expired but still active)
                investments.forEach(inv => {
                    if (inv.status === 'active' && inv.expiryDate) {
                        const exp = inv.expiryDate.toDate ? inv.expiryDate.toDate() : new Date(inv.expiryDate);
                        if (exp < now) {
                            issues.push({
                                type: 'Missed Payout (Ghost Active)',
                                level: 'danger',
                                product: inv.productName,
                                amount: inv.amount,
                                expected: inv.expectedReturn,
                                date: exp,
                                msg: 'This product expired, but the system did not pay the user. They are owed this ROI.'
                            });
                        }
                    }
                });

                // Check B: Tagged Expired Unpaid
                investments.forEach(inv => {
                    if (inv.status === 'expired_unpaid') {
                        issues.push({
                            type: 'Tagged Expired (No Payout)',
                            level: 'warning',
                            product: inv.productName,
                            amount: inv.amount,
                            expected: inv.expectedReturn,
                            date: inv.expiryDate ? (inv.expiryDate.toDate ? inv.expiryDate.toDate() : new Date(inv.expiryDate)) : null,
                            msg: 'Admin script marked this as expired_unpaid. Verify if they actually missed their payout.'
                        });
                    }
                });

                // Check C: Missing Records
                const purchased = userData.purchasedProducts || {};
                const totalPurchased = Object.values(purchased).reduce((sum, c) => sum + (Number(c) || 0), 0);
                
                if (totalPurchased > 0 && investments.length === 0) {
                    issues.push({
                        type: 'Missing Records Entirely',
                        level: 'danger',
                        product: Object.keys(purchased).join(', '),
                        amount: 'N/A',
                        expected: 'N/A',
                        date: null,
                        msg: 'User has purchased products on their profile, but ZERO investment records exist. They missed everything.'
                    });
                }

                // 4. Render Results
                resultCount.innerText = `${issues.length} Found`;

                let html = `
                    <div class="user-summary">
                        <p><strong>Phone:</strong> ${userData.phoneNumber || 'N/A'}</p>
                        <p><strong>Referral Code:</strong> ${userData.myReferralCode || 'N/A'}</p>
                        <p><strong>Withdrawal Wallet:</strong> ₦${(userData.withdrawalWallet || 0).toLocaleString()}</p>
                        <p><strong>Total Investments Found:</strong> ${investments.length}</p>
                    </div>
                `;

                if (issues.length === 0) {
                    html += `
                        <div class="empty-state">
                            <i class="fa-solid fa-circle-check"></i>
                            <p>Perfect! This user has no missed ROIs or missing records.</p>
                        </div>
                    `;
                } else {
                    issues.forEach(issue => {
                        html += `
                            <div class="audit-item">
                                <div class="audit-header ${issue.level}">
                                    <span>${issue.type}</span>
                                    <i class="fa-solid fa-triangle-exclamation"></i>
                                </div>
                                <div class="audit-body">
                                    <div class="audit-row"><span>Product:</span> <strong>${issue.product || 'Unknown'}</strong></div>
                                    <div class="audit-row"><span>Invested:</span> <strong>₦${(issue.amount || 0).toLocaleString()}</strong></div>
                                    <div class="audit-row"><span>Expected ROI:</span> <strong style="color:var(--success)">₦${(issue.expected || 0).toLocaleString()}</strong></div>
                                    <div class="audit-row"><span>Date:</span> <strong>${issue.date ? formatDate(issue.date) : 'N/A'}</strong></div>
                                    <div style="margin-top:10px; padding:10px; background:#f8fafc; border-radius:8px; color:#333; font-style:italic;">
                                        <i class="fa-solid fa-circle-info" style="color:var(--primary-blue)"></i> ${issue.msg}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                resultsBody.innerHTML = html;

            } catch (error) {
                console.error(error);
                resultsBody.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger)"></i><p>Error searching database.</p></div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-search"></i> Scan';
            }
        }
    </script>
</body>
</html>
