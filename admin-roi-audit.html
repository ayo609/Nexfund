<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexfund - Global ROI Audit</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #1d3bba;
            --dark-blue: #16285c;
            --light-bg: #f4f6fc;
            --text-dark: #222;
            --text-gray: #666;
            --success: #00a896;
            --danger: #e74c3c;
            --warning: #f39c12;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--light-bg); min-height: 100vh; padding: 20px; padding-bottom: 50px; }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--dark-blue); font-size: 22px; margin-bottom: 5px; }
        .header p { color: var(--text-gray); font-size: 13px; }

        .scan-card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .scan-btn { background: var(--primary-blue); color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; transition: 0.2s; }
        .scan-btn:disabled { background: #ccc; cursor: not-allowed; }
        .scan-btn:active { transform: scale(0.97); }

        .results-card { background: #fff; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; display: none; }
        .results-header { background: var(--dark-blue); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .results-header h3 { font-size: 15px; }
        .results-body { padding: 20px; }

        .audit-item { border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; overflow: hidden; }
        .audit-header { background: #f8fafc; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .audit-user-info { font-size: 14px; font-weight: 700; color: var(--text-dark); }
        .audit-user-phone { font-size: 12px; color: var(--text-gray); }
        
        .audit-body { padding: 15px; background: #fff; font-size: 12px; color: var(--text-gray); }
        .audit-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px dashed #f0f0f0; padding-bottom: 8px; }
        .audit-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .audit-row strong { color: var(--text-dark); }
        .roi-highlight { color: var(--success); font-size: 14px; font-weight: 700; }

        .credit-btn {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        .credit-btn:active { transform: scale(0.98); }
        .credit-btn:disabled { background: #ccc; cursor: not-allowed; }

        .empty-state { text-align: center; padding: 40px; color: var(--text-gray); font-size: 14px; }
        .empty-state i { font-size: 50px; color: var(--success); margin-bottom: 15px; }

        .spinner { width: 30px; height: 30px; border: 3px solid #e2e8f0; border-top-color: var(--primary-blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,168,150,0.95); color: white; padding: 12px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 2000; opacity: 0; transition: 0.3s; pointer-events: none; text-align: center; }
        .toast.show { opacity: 1; }
        .toast.error { background: rgba(231,76,60,0.95); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🌍 Global ROI Audit</h1>
            <p>Scan the entire database to find users who are owed their ROI.</p>
        </div>

        <div class="scan-card">
            <p style="font-size: 13px; color: var(--text-gray); margin-bottom: 15px;">This will find all investments where the expiry date has passed, but the user was never paid. It will <b>NOT</b> credit anyone automatically.</p>
            <button class="scan-btn" id="scanBtn" onclick="runGlobalScan()"><i class="fa-solid fa-radar"></i> Start Global Scan</button>
        </div>

        <div class="results-card" id="resultsCard">
            <div class="results-header">
                <h3><i class="fa-solid fa-list-check"></i> Missed ROI List</h3>
                <span id="resultCount" style="font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px;">0 Found</span>
            </div>
            <div class="results-body" id="resultsBody">
                <!-- Results injected here -->
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Message</div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBnGer9gGagzUmEkzwZnWhNGZ52WBL6vR0", 
            authDomain: "nexfund-38027.firebaseapp.com", 
            projectId: "nexfund-38027", 
            storageBucket: "nexfund-38027.firebasestorage.app", 
            messagingSenderId: "318202194753", 
            appId: "1:318202194753:web:1bf7471c666acc50174fc0" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.classList.remove('show'), 3500);
        }

        function formatDateTime(ts) {
            if (!ts) return 'Unknown';
            try {
                const d = ts.toDate ? ts.toDate() : new Date(ts);
                if (isNaN(d.getTime())) return 'Invalid Date';
                const date = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                const time = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                return `${date} at ${time}`;
            } catch (e) { return 'Error'; }
        }

        async function runGlobalScan() {
            const btn = document.getElementById('scanBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Scanning Entire Database...';
            
            const resultsCard = document.getElementById('resultsCard');
            const resultsBody = document.getElementById('resultsBody');
            const resultCount = document.getElementById('resultCount');
            
            resultsCard.style.display = 'block';
            resultsBody.innerHTML = '<div class="spinner"></div><p style="text-align:center; font-size:12px; color:#666;">Scanning all investments. This may take a moment...</p>';

            try {
                const now = new Date();
                
                // 1. Fetch all users into a map for quick lookup
                const usersSnap = await db.collection("users").get();
                const usersMap = {};
                usersSnap.forEach(doc => {
                    usersMap[doc.id] = { id: doc.id, ...doc.data() };
                });

                // 2. Fetch ALL investments
                const invSnap = await db.collection("investments").get();
                
                // 3. Group missed ROIs by User
                const missedByUser = {};

                invSnap.forEach(doc => {
                    const inv = doc.data();
                    const userId = inv.userId;
                    
                    // We ONLY want 'active' investments that have passed their expiry date.
                    // We ignore 'expired_unpaid' because we already know about those.
                    if (inv.status === 'active' && inv.expiryDate) {
                        const exp = inv.expiryDate.toDate ? inv.expiryDate.toDate() : new Date(inv.expiryDate);
                        
                        if (exp < now) {
                            // This user missed a payout!
                            if (!missedByUser[userId]) {
                                missedByUser[userId] = {
                                    user: usersMap[userId] || { phoneNumber: 'Unknown User' },
                                    totalROI: 0,
                                    investments: []
                                };
                            }
                            
                            missedByUser[userId].totalROI += (Number(inv.expectedReturn) || 0);
                            missedByUser[userId].investments.push({
                                id: doc.id,
                                ...inv,
                                expiryDateObj: exp
                            });
                        }
                    }
                });

                const missedUserIds = Object.keys(missedByUser);
                resultCount.innerText = `${missedUserIds.length} Users Owed`;

                if (missedUserIds.length === 0) {
                    resultsBody.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-check"></i><p>Perfect! No users are owed any missed ROI. Everything is up to date.</p></div>`;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-radar"></i> Start Global Scan';
                    return;
                }

                // 4. Render the List
                let html = '';
                missedUserIds.forEach(userId => {
                    const data = missedByUser[userId];
                    const u = data.user;

                    html += `
                        <div class="audit-item">
                            <div class="audit-header">
                                <div>
                                    <div class="audit-user-info">${u.phoneNumber || 'No Phone'}</div>
                                    <div class="audit-user-phone">ID: ${u.myReferralCode || 'N/A'}</div>
                                </div>
                                <div class="roi-highlight">Total Owed: ₦${data.totalROI.toLocaleString()}</div>
                            </div>
                            <div class="audit-body">
                                ${data.investments.map(inv => `
                                    <div class="audit-row" style="flex-direction: column; align-items: flex-start;">
                                        <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:5px;">
                                            <strong>${inv.productName}</strong>
                                            <span style="color:var(--success); font-weight:700;">₦${(inv.expectedReturn || 0).toLocaleString()}</span>
                                        </div>
                                        <div style="font-size:11px; color:#666; width:100%; display:flex; justify-content:space-between;">
                                            <span>Invested: ${formatDateTime(inv.purchaseDate)}</span>
                                            <span style="color:var(--danger);">Expired: ${formatDateTime(inv.expiryDateObj)}</span>
                                        </div>
                                    </div>
                                `).join('')}
                                
                                <button class="credit-btn" onclick="creditUserROI('${userId}', ${data.totalROI}, [${data.investments.map(i => `'${i.id}'`).join(',')}], this)">
                                    <i class="fa-solid fa-money-bill-transfer"></i> Credit ₦${data.totalROI.toLocaleString()} to ${u.phoneNumber}
                                </button>
                            </div>
                        </div>
                    `;
                });

                resultsBody.innerHTML = html;

            } catch (error) {
                console.error(error);
                resultsBody.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger)"></i><p>Error during global scan.</p></div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-radar"></i> Start Global Scan';
            }
        }

        // 5. Credit specific user
        async function creditUserROI(userId, amount, invIds, btnElement) {
            if (!confirm(`Are you sure you want to credit ₦${amount.toLocaleString()} to this user's Withdrawal Wallet?`)) return;

            btnElement.disabled = true;
            btnElement.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Crediting...';

            try {
                const batch = db.batch();
                
                // Add money to wallet
                batch.update(db.collection("users").doc(userId), {
                    "withdrawalWallet": firebase.firestore.FieldValue.increment(amount)
                });

                // Mark investments as completed
                invIds.forEach(id => {
                    batch.update(db.collection("investments").doc(id), { status: 'completed' });
                });

                // Log transaction
                const txRef = db.collection("transactions").doc();
                batch.set(txRef, {
                    userId: userId,
                    type: 'roi',
                    amount: amount,
                    status: 'success',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    note: 'Global Audit Manual ROI Payout'
                });

                await batch.commit();

                showToast(`Successfully credited ₦${amount.toLocaleString()}!`, false);
                
                // Remove the item from the UI smoothly
                btnElement.parentElement.parentElement.style.opacity = '0.5';
                btnElement.parentElement.parentElement.style.pointerEvents = 'none';
                btnElement.innerHTML = '<i class="fa-solid fa-check"></i> Paid Successfully';

            } catch (error) {
                console.error("Credit error:", error);
                showToast("Failed to credit ROI.", true);
                btnElement.disabled = false;
                btnElement.innerHTML = `<i class="fa-solid fa-money-bill-transfer"></i> Credit ₦${amount.toLocaleString()}`;
            }
        }
    </script>
</body>
</html>
